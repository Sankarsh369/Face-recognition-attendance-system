<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attendance System{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        {% include 'common/navbar.html' %}
        
        <div class="container content py-3 mt-4">
            {% block content %}{% endblock %}
        </div>
        
        {% include 'common/footer.html' %}
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
        <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" id="appToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="appConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Please confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="appConfirmModalBody"></div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="appConfirmModalOk">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // In-page replacements for window.alert()/confirm(), which render as
        // an ugly browser-chrome dialog outside the page instead of matching
        // the app's own UI.
        function showToast(message, variant = 'dark') {
            const toastEl = document.getElementById('appToast');
            const bodyEl = document.getElementById('appToastBody');
            toastEl.className = 'toast align-items-center text-white border-0 bg-' + variant;
            bodyEl.textContent = message;
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        }

        function showConfirm(message, onConfirm) {
            const modalEl = document.getElementById('appConfirmModal');
            document.getElementById('appConfirmModalBody').textContent = message;
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            const okBtn = document.getElementById('appConfirmModalOk');
            const handler = () => {
                okBtn.removeEventListener('click', handler);
                modal.hide();
                onConfirm();
            };
            okBtn.addEventListener('click', handler);
            modal.show();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
